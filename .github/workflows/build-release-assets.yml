name: Build Release Assets

# Reusable: the build half shared by release-please.yml (stable releases,
# always every variant) and beta-release.yml (beta pre-releases, variants
# picked by checkbox). Builds the selected variants of one commit — HTML,
# Windows installer, Windows portable, macOS, Linux — with `version` stamped
# into the checked-out copy (never committed back), and hands them to the
# caller as workflow artifacts named `release-*`. Publishing is the caller's
# job, so a failed build never leaves a half-filled release behind. See
# PROJECT.md -> "Release builds".
on:
  workflow_call:
    inputs:
      ref:
        description: Commit, tag or branch to build
        type: string
        required: true
      version:
        description: Version to stamp, e.g. 0.2.0 or 0.2.0-beta.3
        type: string
        required: true
      html:
        type: boolean
        default: true
      windows:
        type: boolean
        default: true
      windows_portable:
        type: boolean
        default: true
      mac:
        type: boolean
        default: true
      linux:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  # The `matrix` context isn't available in a job-level `if:` (GitHub rejects
  # the whole file at parse time), so the desktop checkboxes are turned into
  # build_desktop's actual OS list here instead.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      os_list: ${{ steps.os_list.outputs.list }}
    steps:
      - name: Selected desktop runners
        id: os_list
        env:
          WINDOWS: ${{ inputs.windows || inputs.windows_portable }}
          MAC: ${{ inputs.mac }}
          LINUX: ${{ inputs.linux }}
        run: |
          list=()
          [ "$WINDOWS" = "true" ] && list+=('"windows-latest"')
          [ "$MAC" = "true" ] && list+=('"macos-latest"')
          # ubuntu-22.04 rather than -latest on purpose: an AppImage links
          # against the glibc of the machine that built it, so building on
          # the oldest still-supported runner makes it run on anything newer.
          [ "$LINUX" = "true" ] && list+=('"ubuntu-22.04"')
          echo "list=[$(IFS=,; echo "${list[*]}")]" >> "$GITHUB_OUTPUT"

  build_html:
    if: inputs.html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Stamp version, strip comments
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/release-version.js stamp "$VERSION" "$(git rev-parse --short HEAD)"
          node scripts/strip-comments.js philogg.html
          grep -q "const PHILOGG_VERSION = \"${VERSION}\";" philogg.html
          mkdir dist
          cp philogg.html "dist/philogg-${VERSION}.html"
          cp LICENSE.md dist/

      # LICENSE.md travels with every download (the page also shows the full
      # text under Settings -> License).
      - uses: actions/upload-artifact@v4
        with:
          name: release-html
          path: dist/

  build_desktop:
    needs: prepare
    if: needs.prepare.outputs.os_list != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.os_list) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      # THIRD_PARTY_NOTICES.md (license texts of every bundled Rust crate)
      # is committed for local builds, but regenerated here so a release
      # never ships a stale one. See desktop/README.md "Third-party notices".
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about

      - name: Regenerate third-party notices
        working-directory: desktop
        run: cargo about generate -m src-tauri/Cargo.toml about.hbs -o THIRD_PARTY_NOTICES.md

      # Same stamp + comment strip as build_html, applied to the checked-out
      # copy the Tauri bundler embeds as a resource a moment later. The
      # version also goes into package.json/tauri.conf.json/Cargo.toml, so
      # the installers and the exe carry it too.
      - name: Stamp version, strip comments
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node scripts/release-version.js stamp "$VERSION" "$(git rev-parse --short HEAD)"
          node scripts/strip-comments.js philogg.html
          grep -q "const PHILOGG_VERSION = \"${VERSION}\";" philogg.html

      # Bundles whatever tauri.conf.json's targets allow on this OS: NSIS on
      # Windows, DMG on macOS, AppImage on Linux.
      - name: Build
        working-directory: desktop
        run: npm run build

      # Guard against shipping a console-subsystem (debug-style) exe: the
      # release binary must be PE subsystem 2 (Windows GUI), which main.rs's
      # `windows_subsystem = "windows"` gives every non-debug build.
      - name: Verify release exe is a GUI (no-console) build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          EXE=desktop/src-tauri/target/release/philogg-desktop.exe
          PE_OFF=$(od -An -tu4 -j 60 -N4 "$EXE" | tr -d ' ')
          SUBSYSTEM=$(od -An -tu2 -j $((PE_OFF + 92)) -N2 "$EXE" | tr -d ' ')
          echo "PE subsystem: $SUBSYSTEM"
          [ "$SUBSYSTEM" = "2" ] || { echo "::error::$EXE is not a GUI-subsystem build (subsystem $SUBSYSTEM)"; exit 1; }

      # Tauri's bundler has no artifact-name template, so each bundle is
      # copied into dist/ under the release name. Exactly one bundle per
      # selected variant is expected; anything else fails the build.
      - name: Collect installer
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          WANT_WINDOWS: ${{ inputs.windows }}
        run: |
          mkdir -p dist
          BUNDLE=desktop/src-tauri/target/release/bundle
          case "$RUNNER_OS" in
            Windows) [ "$WANT_WINDOWS" = "true" ] || exit 0; SRC=("$BUNDLE"/nsis/*.exe); EXT=exe ;;
            macOS)   SRC=("$BUNDLE"/dmg/*.dmg); EXT=dmg ;;
            Linux)   SRC=("$BUNDLE"/appimage/*.AppImage); EXT=AppImage ;;
          esac
          [ ${#SRC[@]} -eq 1 ] && [ -f "${SRC[0]}" ] || { echo "::error::expected one $EXT bundle, found: ${SRC[*]}"; exit 1; }
          cp "${SRC[0]}" "dist/PhiLogg-${VERSION}.${EXT}"

      # Windows only: `npm run build` already produced the raw, unbundled
      # `cargo build --release` binary alongside the NSIS installer — that
      # binary needs nothing installed to run (WebView2 ships with Windows
      # itself), so it's already "portable" once it carries its own copy of
      # philogg.html and a marker file telling settings.rs/windows.rs to keep
      # settings.json and the webview's storage in a data/ folder beside the
      # exe instead of the OS's per-user directories. See
      # desktop/README.md "Portable build". The zip ends up as a file inside
      # the `release-Windows` artifact, which the caller downloads (unzipping
      # the artifact, not this zip) before publishing.
      - name: Package portable build
        if: runner.os == 'Windows' && inputs.windows_portable
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          STAGE="PhiLogg-${VERSION}_portable"
          mkdir -p "$STAGE"
          cp desktop/src-tauri/target/release/philogg-desktop.exe "$STAGE/PhiLogg.exe"
          cp philogg.html "$STAGE/philogg.html"
          cp desktop/chat.html "$STAGE/chat.html"
          cp LICENSE.md desktop/THIRD_PARTY_NOTICES.md "$STAGE/"
          echo "PhiLogg portable mode marker" > "$STAGE/philogg-portable"
          (cd "$STAGE" && 7z a -tzip "../dist/${STAGE}.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/
          if-no-files-found: error

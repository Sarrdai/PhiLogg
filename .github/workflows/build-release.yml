name: Build Release

# Manual only — same variant checkboxes and build steps as "Build Tester
# Files" (pick the branch to build from via the workflow's own branch
# selector), but this workflow additionally publishes every selected
# variant as a single GitHub Release. Use "Build Tester Files" instead when
# testers just need the build artifacts without a release being created.
on:
  workflow_dispatch:
    inputs:
      build_html:
        description: Build HTML (philogg.html)
        type: boolean
        default: true
      build_windows:
        description: Build Windows (.exe)
        type: boolean
        default: false
      build_windows_portable:
        description: Build Windows portable (.zip)
        type: boolean
        default: false
      build_mac:
        description: Build macOS (.dmg)
        type: boolean
        default: false
      build_linux:
        description: Build Linux (.AppImage)
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Creates the release once, up front, so the build jobs below can each
  # just upload into it — avoids parallel jobs racing to create (or
  # half-create) the same release tag.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      short_sha: ${{ steps.tag.outputs.short_sha }}
      os_list: ${{ steps.os_list.outputs.list }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute release tag
        id: tag
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=build-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      # The `matrix` context isn't available in a job-level `if:` (only in
      # `runs-on`/`env` and inside steps) — trying to filter a fixed matrix
      # that way makes GitHub reject the whole file at parse time, 0 jobs
      # created. So the checkboxes are turned into the `build_desktop` job's
      # actual matrix list here instead.
      - name: Compute selected OS matrix
        id: os_list
        run: |
          list="[]"
          # build_windows_portable also needs the windows-latest runner —
          # deduped with `unique` so ticking both boxes doesn't spawn it twice.
          if [ "${{ inputs.build_windows }}" = "true" ] || [ "${{ inputs.build_windows_portable }}" = "true" ]; then
            list=$(echo "$list" | jq -c '. + ["windows-latest"] | unique')
          fi
          [ "${{ inputs.build_mac }}" = "true" ] && list=$(echo "$list" | jq -c '. + ["macos-latest"]')
          [ "${{ inputs.build_linux }}" = "true" ] && list=$(echo "$list" | jq -c '. + ["ubuntu-22.04"]')
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" \
            --title "PhiLogg build ${{ steps.tag.outputs.tag }}" \
            --notes "Automated tester build. Proprietary — see the in-app License panel. Not for redistribution."

  build_html:
    needs: prepare
    if: inputs.build_html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Stamp build hash, strip comments and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          COMMIT_DATE=$(git show -s --format=%cd --date=format:%Y-%m-%d HEAD)
          sed -i "s/const PHILOGG_BUILD = \"dev\";/const PHILOGG_BUILD = \"${SHORT_SHA}\";/" philogg.html
          grep -q "const PHILOGG_BUILD = \"${SHORT_SHA}\";" philogg.html
          ASSET_NAME="philogg-${COMMIT_DATE}-${SHORT_SHA}.html"
          cp philogg.html "${ASSET_NAME}"
          node scripts/strip-comments.js "${ASSET_NAME}"
          grep -q "const PHILOGG_BUILD = \"${SHORT_SHA}\";" "${ASSET_NAME}"
          gh release upload "${{ needs.prepare.outputs.tag }}" "${ASSET_NAME}" --clobber

  build_desktop:
    needs: prepare
    if: needs.prepare.outputs.os_list != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.os_list) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # ubuntu-22.04 rather than -latest on purpose: an AppImage links
      # against the glibc of the machine that built it, so building on the
      # oldest still-supported runner is what makes it run on anything
      # newer too.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      # Same short-SHA stamp + comment strip build_html uses, applied to the
      # checked-out copy the Tauri bundler embeds as a resource a moment
      # later, so the packaged philogg.html matches the standalone HTML
      # build. `sed -i.bak` because BSD sed (macOS runner) requires an
      # argument to -i.
      - name: Stamp build hash and strip comments
        shell: bash
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          sed -i.bak "s/const PHILOGG_BUILD = \"dev\";/const PHILOGG_BUILD = \"${SHORT_SHA}\";/" philogg.html
          rm -f philogg.html.bak
          grep -q "const PHILOGG_BUILD = \"${SHORT_SHA}\";" philogg.html
          node scripts/strip-comments.js philogg.html
          grep -q "const PHILOGG_BUILD = \"${SHORT_SHA}\";" philogg.html

      - name: Build installer
        working-directory: desktop
        run: npm run build

      # Windows only: `npm run build` already produced the raw, unbundled
      # `cargo build --release` binary alongside the NSIS installer — that
      # binary needs nothing installed to run (WebView2 ships with Windows
      # itself), so it's already "portable" once it carries its own copy of
      # philogg.html and a marker file telling settings.rs/windows.rs to keep
      # settings.json and the webview's storage in a data/ folder beside the
      # exe instead of the OS's per-user directories. See
      # desktop/README.md "Portable build".
      - name: Package Windows portable build
        if: runner.os == 'Windows' && inputs.build_windows_portable
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          STAGE="PhiLogg-${SHA}_portable"
          mkdir -p "$STAGE"
          cp desktop/src-tauri/target/release/philogg-desktop.exe "$STAGE/PhiLogg.exe"
          cp philogg.html "$STAGE/philogg.html"
          touch "$STAGE/philogg-portable"
          (cd "$STAGE" && 7z a -tzip "../${STAGE}.zip" .)

      - name: Upload installer(s)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.prepare.outputs.short_sha }}
        shell: bash
        # windows/macos have both failed a `gh release upload` before with a
        # clean build and no error output, which matches a transient upload
        # hiccup rather than a script bug — so retry with backoff instead of
        # failing the whole job on the first blip. `-e` won't abort the loop
        # early: the failing `gh` call sits inside an `if`, which is exempt
        # from errexit.
        run: |
          upload_with_retry() {
            local f="$1" attempt
            for attempt in 1 2 3 4 5; do
              if gh release upload "${{ needs.prepare.outputs.tag }}" "$f" --clobber; then
                return 0
              fi
              echo "::warning::upload of $f failed (attempt $attempt/5), retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
            echo "::error::giving up uploading $f after 5 attempts"
            return 1
          }
          BUNDLE=desktop/src-tauri/target/release/bundle
          shopt -s nullglob
          for f in "$BUNDLE"/nsis/*.exe "$BUNDLE"/dmg/*.dmg "$BUNDLE"/appimage/*.AppImage; do
            renamed="$(dirname "$f")/PhiLogg-${SHA}.${f##*.}"
            mv "$f" "$renamed"
            upload_with_retry "$renamed"
          done
          PORTABLE="PhiLogg-${SHA}_portable.zip"
          if [ -f "$PORTABLE" ]; then
            upload_with_retry "$PORTABLE"
          fi

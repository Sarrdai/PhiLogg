name: Build Tester Files

# Manual only — run this from the Actions tab (pick the branch to build from
# via the workflow's own branch selector) whenever a build should go out to
# external testers, without publishing a GitHub Release. Every selected
# variant is uploaded as a workflow run artifact instead — download them
# from the run's summary page. For a build that should also appear as a
# GitHub Release, use "Build Release" instead — same options, same build
# steps, it just additionally creates a release.
on:
  workflow_dispatch:
    inputs:
      build_html:
        description: Build HTML (philogg.html)
        type: boolean
        default: true
      build_windows:
        description: Build Windows (.exe)
        type: boolean
        default: false
      build_windows_portable:
        description: Build Windows portable (.zip)
        type: boolean
        default: false
      build_mac:
        description: Build macOS (.dmg)
        type: boolean
        default: false
      build_linux:
        description: Build Linux (.AppImage)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # The `matrix` context isn't available in a job-level `if:` (only in
  # `runs-on`/`env` and inside steps) — trying to filter a fixed matrix that
  # way makes GitHub reject the whole file at parse time, 0 jobs created. So
  # the checkboxes are turned into the `build_desktop` job's actual matrix
  # list here instead.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      os_list: ${{ steps.os_list.outputs.list }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute short SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute selected OS matrix
        id: os_list
        run: |
          list="[]"
          # build_windows_portable also needs the windows-latest runner —
          # deduped with `unique` so ticking both boxes doesn't spawn it twice.
          if [ "${{ inputs.build_windows }}" = "true" ] || [ "${{ inputs.build_windows_portable }}" = "true" ]; then
            list=$(echo "$list" | jq -c '. + ["windows-latest"] | unique')
          fi
          [ "${{ inputs.build_mac }}" = "true" ] && list=$(echo "$list" | jq -c '. + ["macos-latest"]')
          [ "${{ inputs.build_linux }}" = "true" ] && list=$(echo "$list" | jq -c '. + ["ubuntu-22.04"]')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build_html:
    needs: prepare
    if: inputs.build_html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Stamp version and strip comments
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          COMMIT_DATE=$(git show -s --format=%cd --date=format:%Y-%m-%d HEAD)
          sed -i "s/const PHILOGG_VERSION = \"dev\";/const PHILOGG_VERSION = \"${SHORT_SHA}\";/" philogg.html
          grep -q "const PHILOGG_VERSION = \"${SHORT_SHA}\";" philogg.html
          ASSET_NAME="philogg-${COMMIT_DATE}-${SHORT_SHA}.html"
          cp philogg.html "${ASSET_NAME}"
          node scripts/strip-comments.js "${ASSET_NAME}"
          grep -q "const PHILOGG_VERSION = \"${SHORT_SHA}\";" "${ASSET_NAME}"
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: ${{ env.ASSET_NAME }}

  build_desktop:
    needs: prepare
    if: needs.prepare.outputs.os_list != '[]'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.prepare.outputs.os_list) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      # ubuntu-22.04 rather than -latest on purpose: an AppImage links
      # against the glibc of the machine that built it, so building on the
      # oldest still-supported runner is what makes it run on anything
      # newer too.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      # Same short-SHA stamp + comment strip build_html uses, applied to the
      # checked-out copy the Tauri bundler embeds as a resource a moment
      # later, so the packaged philogg.html matches the standalone HTML
      # build. `sed -i.bak` because BSD sed (macOS runner) requires an
      # argument to -i.
      - name: Stamp version and strip comments
        shell: bash
        env:
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          sed -i.bak "s/const PHILOGG_VERSION = \"dev\";/const PHILOGG_VERSION = \"${SHORT_SHA}\";/" philogg.html
          rm -f philogg.html.bak
          grep -q "const PHILOGG_VERSION = \"${SHORT_SHA}\";" philogg.html
          node scripts/strip-comments.js philogg.html
          grep -q "const PHILOGG_VERSION = \"${SHORT_SHA}\";" philogg.html

      - name: Build installer
        working-directory: desktop
        run: npm run build

      # Windows only: `npm run build` already produced the raw, unbundled
      # `cargo build --release` binary alongside the NSIS installer — that
      # binary needs nothing installed to run (WebView2 ships with Windows
      # itself), so it's already "portable" once it carries its own copy of
      # philogg.html and a marker file telling settings.rs/windows.rs to keep
      # settings.json and the webview's storage in a data/ folder beside the
      # exe instead of the OS's per-user directories. See
      # desktop/README.md "Portable build".
      - name: Package Windows portable build
        if: runner.os == 'Windows' && inputs.build_windows_portable
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          STAGE="PhiLogg-${SHA}_portable"
          mkdir -p "$STAGE"
          cp desktop/src-tauri/target/release/philogg-desktop.exe "$STAGE/PhiLogg.exe"
          cp philogg.html "$STAGE/philogg.html"
          touch "$STAGE/philogg-portable"
          (cd "$STAGE" && 7z a -tzip "../${STAGE}.zip" .)

      - name: Rename installer(s)
        shell: bash
        env:
          SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          BUNDLE=desktop/src-tauri/target/release/bundle
          shopt -s nullglob
          for f in "$BUNDLE"/nsis/*.exe "$BUNDLE"/dmg/*.dmg "$BUNDLE"/appimage/*.AppImage; do
            mv "$f" "$(dirname "$f")/PhiLogg-${SHA}.${f##*.}"
          done

      - name: Upload Windows installer
        if: runner.os == 'Windows' && inputs.build_windows
        uses: actions/upload-artifact@v4
        with:
          name: PhiLogg-${{ needs.prepare.outputs.short_sha }}-windows-installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload Windows portable build
        if: runner.os == 'Windows' && inputs.build_windows_portable
        uses: actions/upload-artifact@v4
        with:
          name: PhiLogg-${{ needs.prepare.outputs.short_sha }}-windows-portable
          path: PhiLogg-${{ needs.prepare.outputs.short_sha }}_portable.zip

      - name: Upload macOS installer
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: PhiLogg-${{ needs.prepare.outputs.short_sha }}-macos
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload Linux installer
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: PhiLogg-${{ needs.prepare.outputs.short_sha }}-linux
          path: desktop/src-tauri/target/release/bundle/appimage/*.AppImage

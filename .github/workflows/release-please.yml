name: Release Please

# Two explicit stages — nothing about a real, versioned release happens
# automatically just because a normal feature PR merged into main:
#
#  1. propose-release (workflow_dispatch only — run it by hand from the
#     Actions tab whenever you want release-please to look at commits since
#     the last release and open/refresh the standing release PR for
#     review). Never tags or publishes anything by itself
#     (skip-github-release), so running this is harmless/idempotent.
#  2. cut-release (push to main) only ever does something on the ONE push
#     that is the release PR's own merge — skip-github-pull-request means
#     it never opens/updates a PR here, it only looks for a just-merged
#     release branch to tag; an ordinary feature-PR merge is a fast no-op.
#     Once a release is actually cut, build_html/build_desktop build every
#     variant (HTML, Windows, Windows portable, macOS, Linux) and upload
#     them to that same GitHub Release. See PROJECT.md -> "Release builds".
#
# "Build Tester Files" (build-tester-files.yml) is unchanged and separate:
# unversioned, ad-hoc tester drops on demand, no GitHub Release involved.
on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  propose-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  cut-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  build_html:
    needs: cut-release
    if: needs.cut-release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.cut-release.outputs.tag_name }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Stamp build hash, strip comments and upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(git show -s --format=%cd --date=format:%Y-%m-%d HEAD)
          sed -i "s/const PHILOGG_BUILD = \"dev\";/const PHILOGG_BUILD = \"${SHORT_SHA}\";/" philogg.html
          grep -q "const PHILOGG_BUILD = \"${SHORT_SHA}\";" philogg.html
          ASSET_NAME="philogg-${COMMIT_DATE}-${SHORT_SHA}.html"
          cp philogg.html "${ASSET_NAME}"
          node scripts/strip-comments.js "${ASSET_NAME}"
          grep -q "const PHILOGG_BUILD = \"${SHORT_SHA}\";" "${ASSET_NAME}"
          gh release upload "${{ needs.cut-release.outputs.tag_name }}" "${ASSET_NAME}" --clobber

  build_desktop:
    needs: cut-release
    if: needs.cut-release.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.cut-release.outputs.tag_name }}

      # ubuntu-22.04 rather than -latest on purpose: an AppImage links
      # against the glibc of the machine that built it, so building on the
      # oldest still-supported runner is what makes it run on anything
      # newer too.
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      # Same short-SHA stamp + comment strip build_html uses, applied to the
      # checked-out copy the Tauri bundler embeds as a resource a moment
      # later, so the packaged philogg.html matches the standalone HTML
      # build. `sed -i.bak` because BSD sed (macOS runner) requires an
      # argument to -i.
      - name: Stamp build hash and strip comments
        shell: bash
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "SHORT_SHA=${SHORT_SHA}" >> "$GITHUB_ENV"
          sed -i.bak "s/const PHILOGG_BUILD = \"dev\";/const PHILOGG_BUILD = \"${SHORT_SHA}\";/" philogg.html
          rm -f philogg.html.bak
          grep -q "const PHILOGG_BUILD = \"${SHORT_SHA}\";" philogg.html
          node scripts/strip-comments.js philogg.html
          grep -q "const PHILOGG_BUILD = \"${SHORT_SHA}\";" philogg.html

      - name: Build installer
        working-directory: desktop
        run: npm run build

      # Windows only: `npm run build` already produced the raw, unbundled
      # `cargo build --release` binary alongside the NSIS installer — that
      # binary needs nothing installed to run (WebView2 ships with Windows
      # itself), so it's already "portable" once it carries its own copy of
      # philogg.html and a marker file telling settings.rs/windows.rs to keep
      # settings.json and the webview's storage in a data/ folder beside the
      # exe instead of the OS's per-user directories. See
      # desktop/README.md "Portable build".
      - name: Package Windows portable build
        if: runner.os == 'Windows'
        shell: bash
        run: |
          STAGE="PhiLogg-${SHORT_SHA}_portable"
          mkdir -p "$STAGE"
          cp desktop/src-tauri/target/release/philogg-desktop.exe "$STAGE/PhiLogg.exe"
          cp philogg.html "$STAGE/philogg.html"
          touch "$STAGE/philogg-portable"
          (cd "$STAGE" && 7z a -tzip "../${STAGE}.zip" .)

      - name: Upload installer(s)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        # windows/macos have both failed a `gh release upload` before with a
        # clean build and no error output, which matches a transient upload
        # hiccup rather than a script bug — so retry with backoff instead of
        # failing the whole job on the first blip. `-e` won't abort the loop
        # early: the failing `gh` call sits inside an `if`, which is exempt
        # from errexit.
        run: |
          upload_with_retry() {
            local f="$1" attempt
            for attempt in 1 2 3 4 5; do
              if gh release upload "${{ needs.cut-release.outputs.tag_name }}" "$f" --clobber; then
                return 0
              fi
              echo "::warning::upload of $f failed (attempt $attempt/5), retrying in $((attempt * 5))s"
              sleep $((attempt * 5))
            done
            echo "::error::giving up uploading $f after 5 attempts"
            return 1
          }
          BUNDLE=desktop/src-tauri/target/release/bundle
          shopt -s nullglob
          for f in "$BUNDLE"/nsis/*.exe "$BUNDLE"/dmg/*.dmg "$BUNDLE"/appimage/*.AppImage; do
            renamed="$(dirname "$f")/PhiLogg-${SHORT_SHA}.${f##*.}"
            mv "$f" "$renamed"
            upload_with_retry "$renamed"
          done
          PORTABLE="PhiLogg-${SHORT_SHA}_portable.zip"
          if [ -f "$PORTABLE" ]; then
            upload_with_retry "$PORTABLE"
          fi

name: Release Please

# Two explicit stages — nothing about a real, versioned release happens
# automatically just because a normal feature PR merged into main:
#
#  1. propose-release (workflow_dispatch only — run it by hand from the
#     Actions tab whenever you want release-please to look at commits since
#     the last release and open/refresh the standing release PR for
#     review). Never tags or publishes anything by itself
#     (skip-github-release), so running this is harmless/idempotent.
#  2. cut-release (push to main) only ever does something on the ONE push
#     that is the release PR's own merge — skip-github-pull-request means
#     it never opens/updates a PR here, it only looks for a just-merged
#     release branch to tag; an ordinary feature-PR merge is a fast no-op.
#     Once a release is actually cut, `build` (build-release-assets.yml)
#     builds every variant (HTML, Windows installer, Windows portable,
#     macOS, Linux — a merge has no run dialog to pick from) and `publish`
#     uploads them to that same GitHub Release. See PROJECT.md ->
#     "Release builds".
#
# Beta pre-releases (v0.2.0-beta.N) are a separate, manual workflow:
# beta-release.yml. It never touches the manifest, so release-please keeps
# computing the next stable version from the last stable release.
on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  propose-release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

  cut-release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - name: Version from tag
        id: version
        if: steps.release.outputs.release_created == 'true'
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: cut-release
    if: needs.cut-release.outputs.release_created == 'true'
    uses: ./.github/workflows/build-release-assets.yml
    with:
      ref: ${{ needs.cut-release.outputs.tag_name }}
      version: ${{ needs.cut-release.outputs.version }}

  publish:
    needs: [cut-release, build]
    runs-on: ubuntu-latest
    steps:
      # The HTML artifact is a regular zip (page + LICENSE.md) and gets
      # unpacked; the desktop files were uploaded unzipped and must not be,
      # or the portable zip would arrive as loose files.
      - uses: actions/download-artifact@v8
        with:
          pattern: release-html
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v8
        with:
          pattern: PhiLogg-*
          path: dist
          merge-multiple: true
          skip-decompress: true

      # This has failed a `gh release upload` before with a clean build and
      # no error output, which matches a transient upload hiccup rather
      # than a script bug — so retry with backoff instead of failing the
      # whole job on the first blip.
      - name: Upload assets to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.cut-release.outputs.tag_name }}
        run: |
          for attempt in 1 2 3 4 5; do
            if gh release upload "$TAG" dist/* --clobber; then
              exit 0
            fi
            echo "::warning::upload failed (attempt $attempt/5), retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "::error::giving up uploading release assets after 5 attempts"
          exit 1

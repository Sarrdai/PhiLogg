name: Build tester release

# Manual only — run this from the Actions tab whenever a build should go out
# to external testers. Stamps PHILOGG_VERSION (in philogg.html) with the
# short commit hash of the checked-out commit, strips every source comment
# out of it, and publishes the result as a GitHub Release asset, named
# philogg-<commit-date>-<short-sha>.html so the version and its age are
# visible from the filename alone. Never commits either change back — the
# tracked philogg.html always keeps PHILOGG_VERSION = "dev" and all of its
# comments.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Stamp version
        id: stamp
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          COMMIT_DATE=$(git show -s --format=%cd --date=format:%Y-%m-%d HEAD)
          sed -i "s/const PHILOGG_VERSION = \"dev\";/const PHILOGG_VERSION = \"${SHORT_SHA}\";/" philogg.html
          grep -q "const PHILOGG_VERSION = \"${SHORT_SHA}\";" philogg.html
          ASSET_NAME="philogg-${COMMIT_DATE}-${SHORT_SHA}.html"
          cp philogg.html "${ASSET_NAME}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      # Release-only: the repo copy keeps every comment, the published asset
      # carries none. Runs on the already-stamped copy, after `cp`, so the
      # stripper never has to preserve the version line as a special case.
      # Dependency-free by design — no npm install in this job.
      - name: Strip comments
        env:
          ASSET_NAME: ${{ steps.stamp.outputs.asset_name }}
        run: |
          node scripts/strip-comments.js "${ASSET_NAME}"
          grep -q "const PHILOGG_VERSION = \"${{ steps.stamp.outputs.short_sha }}\";" "${ASSET_NAME}"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHORT_SHA: ${{ steps.stamp.outputs.short_sha }}
          ASSET_NAME: ${{ steps.stamp.outputs.asset_name }}
        run: |
          gh release create "build-${SHORT_SHA}" "${ASSET_NAME}" \
            --title "PhiLogg build ${SHORT_SHA}" \
            --notes "Automated tester build of philogg.html, stamped with version ${SHORT_SHA}. Proprietary — see the in-app License panel. Not for redistribution."

# Regression suite (tests/) on every push to a session branch and every PR
# into main: an independent green/red for each branch, on a machine with a
# different load than the session container. Markdown-only changes skip it,
# like CLAUDE.md says for local runs. See tests/README.md.
name: Tests

on:
  push:
    branches: ["claude/**"]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: npm ci
        working-directory: tests
      - run: npm test
        working-directory: tests

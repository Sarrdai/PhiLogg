# cargo-about configuration for THIRD_PARTY_NOTICES.md — regenerate with
# `cargo about generate -m src-tauri/Cargo.toml about.hbs -o THIRD_PARTY_NOTICES.md`
# (run from desktop/) whenever src-tauri/Cargo.lock changes; see
# desktop/README.md -> "Third-party notices".
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "CDLA-Permissive-2.0",
]
# PhiLogg's own crates carry no open-source license.
ignore-build-dependencies = false
ignore-dev-dependencies = true
private = { ignore = true }

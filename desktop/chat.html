<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhiLogg Assistant</title>
<!--
  The LLM assistant's chat (docs/llm-assistant.md → "Chat view"). A THIN
  view: the agent loop, the sessions and everything about the filter tree
  live in philogg.html's main window. This page only renders the complete
  session snapshot it pulls from there ({type:"getSnapshot"} → {type:
  "snapshot"}) and sends the person's commands back. A {type:"changed"}
  note only says "there is something new" — the view answers with a pull,
  so a missed note heals itself on the next one; there are no deltas to
  lose (the lesson of the abandoned popout window, docs/desktop.md →
  "Picture-in-picture"). {type:"stream"} carries the answer being typed,
  purely cosmetic: the next snapshot replaces it.

  Transports (chatTransport below): a preset window.philoggChatTransport
  (the regression suite), an <iframe> inside the main window (docked,
  postMessage), or its own desktop window (Tauri: llm_view_to_main /
  window.philoggChatReceive).
-->
<style>
  :root{
    --bg-app:#0f121a; --bg-panel:#151924; --bg-elevated:#1b2030; --bg-elevated-2:#232a3d;
    --border:#2a3144; --border-soft:#222839; --text-primary:#e6e9f0; --text-secondary:#a6adbf;
    --text-tertiary:#737b90; --accent:#6fa8ff; --accent-soft:rgba(111,168,255,.14); --accent-strong:#8bb8ff; --accent-on:#08201f;
    --border-hover:color-mix(in srgb, var(--border) 70%, var(--text-tertiary) 30%);
    --level-error:#f0708a; --level-warn:#e8a94a;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --font-mono:"SF Mono",SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; height:100%; background:var(--bg-panel); color:var(--text-primary); font:13px/1.45 var(--font-ui);}
  body{display:flex; flex-direction:column;}
  /* Title bar — the same look as philogg.html's #toolbar (--bg-panel, bottom
     border) and, like the main window, frameless: it is the window's drag
     handle (data-tauri-drag-region) and carries the window controls
     (#chatWc, same shape as inject.js's #tauri-wc). */
  #chatTitlebar{flex:0 0 auto; height:44px; display:flex; align-items:center; gap:6px; padding:0 8px 0 12px; background:var(--bg-panel); border-bottom:1px solid var(--border); user-select:none;}
  html.mac #chatTitlebar{padding-left:78px;} /* native traffic lights sit top-left */
  .brand-mark{display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:5px; flex:0 0 auto;
    background:linear-gradient(135deg, var(--accent), var(--accent-strong)); color:var(--accent-on);}
  #chatTitle{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:650; font-size:13.5px; letter-spacing:.2px;}
  #chatToolbar{flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:6px 8px; border-bottom:1px solid var(--border); background:var(--bg-panel);}
  #sessionSelect{flex:1 1 auto; min-width:0; height:28px; background:var(--bg-app); color:var(--text-primary); border:1px solid var(--border); border-radius:6px; padding:0 8px; font:12.5px var(--font-ui); cursor:pointer;}
  #sessionSelect:disabled{opacity:.5; cursor:default;}
  /* philogg.html's .toolbar-icon-btn, 1:1. */
  .toolbar-icon-btn{display:flex; align-items:center; justify-content:center; width:28px; height:28px; flex:0 0 auto; padding:0;
    background:var(--bg-elevated); color:var(--text-secondary); border:1px solid var(--border); border-radius:7px;
    cursor:pointer; transition:background .12s, border-color .12s, color .12s;}
  .toolbar-icon-btn:hover{background:var(--bg-elevated-2); border-color:var(--border-hover); color:var(--text-primary);}
  .toolbar-icon-btn:disabled{opacity:.32; cursor:default; pointer-events:none;}
  .toolbar-icon-btn.active{background:var(--accent-soft); border-color:var(--accent-strong); color:var(--accent-strong);}
  /* inject.js's #tauri-wc, 1:1. */
  #chatWc{display:flex; align-items:center; gap:2px; margin-left:4px; margin-right:-2px;}
  #chatWc button{width:30px; height:30px; padding:0; border:0; border-radius:7px; display:flex; align-items:center; justify-content:center;
    background:transparent; color:var(--text-secondary); cursor:pointer;}
  #chatWc button:hover{background:var(--bg-elevated-2); color:var(--accent);}
  #chatWc button[data-act="close"]:hover{background:var(--level-error); color:#fff;}
  [data-tauri-drag-region]{cursor:default;}
  #chatHint{flex:0 0 auto; padding:5px 10px; font-size:12px; color:var(--level-warn); background:var(--bg-elevated); border-bottom:1px solid var(--border-soft);}
  #chatHint:empty{display:none;}
  #chatLog{flex:1 1 auto; overflow-y:auto; padding:10px;}
  #chatEmpty{color:var(--text-tertiary); text-align:center; margin-top:30px; white-space:pre-line;}
  .round{margin-bottom:14px;}
  .msg-user{margin-left:18%; padding:6px 9px; border-radius:9px 9px 2px 9px; background:var(--accent-soft); white-space:pre-wrap; word-wrap:break-word;}
  .msg-text{margin:6px 18% 0 0; white-space:pre-wrap; word-wrap:break-word;}
  .msg-text ul{margin:2px 0; padding-left:18px;}
  .msg-tool{margin:3px 0 0; font:11.5px/1.35 var(--font-mono); color:var(--text-tertiary); white-space:pre-wrap; word-wrap:break-word;}
  .msg-tool.err{color:var(--level-error);}
  .msg-stream{margin-top:6px; white-space:pre-wrap; color:var(--text-secondary);}
  .msg-status{margin-top:5px; font-size:12px; color:var(--level-warn);}
  .msg-status.error{color:var(--level-error);}
  .round-actions{margin-top:5px; display:flex; gap:6px; flex-wrap:wrap;}
  /* philogg.html's .btn-mini-outline. */
  .answer-opt{background:transparent; color:var(--text-secondary); border:1px solid var(--border); border-radius:6px; padding:5px 10px; font:11.5px var(--font-ui); cursor:pointer; transition:border-color .12s, color .12s;}
  .answer-opt:hover{border-color:var(--accent); color:var(--accent-strong);}
  .undo-round{border:0; background:transparent; color:var(--text-tertiary); cursor:pointer; padding:0; font:inherit; font-size:11.5px; text-decoration:underline dotted;}
  .undo-round:hover:not(:disabled){color:var(--accent);}
  .undo-round:disabled{opacity:.5; cursor:default; text-decoration:none;}
  .ref{font-family:var(--font-mono); font-size:12px; padding:0 2px; border-radius:3px;}
  a.ref{color:var(--accent); cursor:pointer; text-decoration:underline dotted;}
  a.ref:hover{background:var(--accent-soft);}
  .ref-gone{color:var(--text-tertiary); text-decoration:line-through;}
  .ref-text{color:var(--text-secondary);}
  .busy-dots::after{content:"…"; animation:blink 1s infinite;}
  @keyframes blink{50%{opacity:.2;}}
  #chatInputRow{flex:0 0 auto; display:flex; align-items:flex-end; gap:8px; padding:8px; border-top:1px solid var(--border); background:var(--bg-panel);}
  #chatInput{flex:1 1 auto; resize:none; height:54px; background:var(--bg-app); color:var(--text-primary); border:1px solid var(--border); border-radius:6px; padding:6px 10px; font:12.5px/1.45 var(--font-ui);}
  #chatInput:focus{outline:none; border-color:var(--accent);}
  /* philogg.html's .btn-mini (the primary button). */
  #chatSend{flex:0 0 auto; min-width:64px; background:var(--accent); color:var(--accent-on); border:none; border-radius:6px; padding:8px 12px; font:650 12px var(--font-ui); cursor:pointer;}
  #chatSend.stop{background:var(--level-error); color:#fff;}
  #chatSend:disabled{opacity:.5; cursor:default;}
</style>
</head>
<body>
  <div id="chatTitlebar" data-tauri-drag-region>
    <span class="brand-mark" data-tauri-drag-region><svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 3.5h11v7h-6l-3 2.5v-2.5h-2z"/></svg></span>
    <span id="chatTitle" data-tauri-drag-region>Assistant</span>
    <button type="button" class="toolbar-icon-btn" id="btnOnTop" title="Always on top (over every program)"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2.5h4M7 2.5v4L4.5 9h7L9 6.5v-4M8 9v4.5"/></svg></button>
    <button type="button" class="toolbar-icon-btn" id="btnDock" title="Dock into the main window"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M10 2.5v11"/></svg></button>
    <button type="button" class="toolbar-icon-btn" id="btnChatSettings" title="Assistant settings"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    <div id="chatWc">
      <button type="button" data-act="minimize" title="Minimize"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0" y="4.5" width="10" height="1" fill="currentColor"/></svg></button>
      <button type="button" data-act="maximize" title="Maximize / Restore"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" aria-hidden="true"><rect x="0.5" y="0.5" width="9" height="9"/></svg></button>
      <button type="button" data-act="close" title="Close (the chat keeps running — the toolbar button brings it back)"><svg width="10" height="10" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9"/></svg></button>
    </div>
  </div>
  <div id="chatToolbar">
    <select id="sessionSelect" title="Chat sessions"></select>
    <button type="button" class="toolbar-icon-btn" id="btnNewSession" title="New chat"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
    <button type="button" class="toolbar-icon-btn" id="btnRenameSession" title="Rename this chat"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 3 13 5.5 6 12.5H3.5V10z"/></svg></button>
    <button type="button" class="toolbar-icon-btn" id="btnDeleteSession" title="Delete this chat"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg></button>
  </div>
  <div id="chatHint"></div>
  <div id="chatLog"><div id="chatEmpty">Ask about the loaded log — e.g.
"I'm interested in the temperature after every positioning."</div></div>
  <div id="chatInputRow">
    <textarea id="chatInput" placeholder="Message (Enter sends, Shift+Enter new line)"></textarea>
    <button type="button" id="chatSend">Send</button>
  </div>
<script>
(function () {
  "use strict";

  // ------------------------------------------------------------ transport
  function chatTransport() {
    if (window.philoggChatTransport) return window.philoggChatTransport;
    if (window.parent && window.parent !== window) {
      // Docked: same origin as philogg.html, which listens for these.
      return {
        mode: "docked",
        send: function (msg) { window.parent.postMessage({ philoggChat: msg }, "*"); },
        onMessage: function (fn) {
          window.addEventListener("message", function (ev) {
            if (ev.source === window.parent && ev.data && ev.data.philoggChat) fn(ev.data.philoggChat);
          });
        },
      };
    }
    // Own desktop window: Rust relays both ways (commands.rs llm_view_to_main,
    // and an eval of window.philoggChatReceive for the other direction).
    return {
      mode: "window",
      send: function (msg) {
        try { window.__TAURI_INTERNALS__.invoke("llm_view_to_main", { msg: msg }); } catch (e) { /* no host */ }
      },
      onMessage: function (fn) { window.philoggChatReceive = fn; },
      windowAction: function (act) {
        var cmd = { minimize: "window_minimize", maximize: "window_toggle_maximize", close: "window_close" }[act];
        try { if (cmd) window.__TAURI_INTERNALS__.invoke(cmd); } catch (e) { /* no host */ }
      },
    };
  }
  var transport = chatTransport();
  var ICON_DOCK = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/><path d="M10 2.5v11"/></svg>';
  var ICON_UNDOCK = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5h4.5V7M13.5 2.5 8 8M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg>';

  // Frameless own window: the title bar's window controls (the same
  // commands the main window's injected #tauri-wc uses — they act on the
  // calling window; close goes through its close request, which only hides
  // the chat). macOS keeps its native traffic lights (?mac=1, see windows.rs).
  var isMac = /[?&]mac=1\b/.test(location.search);
  if (isMac) document.documentElement.classList.add("mac");
  document.getElementById("chatWc").style.display = transport.windowAction && !isMac ? "" : "none";
  document.getElementById("chatWc").addEventListener("click", function (ev) {
    var btn = ev.target.closest("button[data-act]");
    if (btn && transport.windowAction) transport.windowAction(btn.dataset.act);
  });

  // ------------------------------------------------------------ state
  var snap = null;        // last snapshot
  var stream = null;      // { roundId, text } of the running answer
  var el = function (id) { return document.getElementById(id); };
  var log = el("chatLog"), input = el("chatInput"), sendBtn = el("chatSend"), hint = el("chatHint");
  var sessionSelect = el("sessionSelect");

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Text with references: every n123/e456 the main window resolved for this
  // round becomes a link (clickable), a greyed-out id (node deleted), or
  // plain text (another app run / file not loaded).
  function renderRefs(text, roundId) {
    var refs = (snap && snap.session && snap.session.refs) || {};
    return esc(text).replace(/\b([ne]\d+)\b/g, function (token) {
      var ref = refs[roundId + ":" + token];
      if (!ref) return token;
      var title = esc(ref.label + (ref.title ? " — " + ref.title : ""));
      if (ref.state === "link") return '<a class="ref" data-round="' + esc(roundId) + '" data-token="' + token + '" title="' + title + '">' + token + "</a>";
      if (ref.state === "gone") return '<span class="ref ref-gone" title="' + title + ' (deleted)">' + token + "</span>";
      return '<span class="ref ref-text" title="' + title + ' (from another session of the app)">' + token + "</span>";
    });
  }
  // Minimal markdown: "- " lines become a list.
  function renderText(text, roundId) {
    var lines = String(text).split("\n"), html = "", inList = false;
    lines.forEach(function (line) {
      var m = /^\s*[-*•]\s+(.*)$/.exec(line);
      if (m) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += "<li>" + renderRefs(m[1], roundId) + "</li>";
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        html += renderRefs(line, roundId) + "\n";
      }
    });
    if (inList) html += "</ul>";
    return html.replace(/\n$/, "");
  }
  // The answer options of a question (phase 5): the "- " lines of the last
  // text of the newest round, when that round ended with a question.
  function answerOptions(round) {
    if (round.status !== "done") return [];
    var last = round.items[round.items.length - 1];
    if (!last || last.kind !== "text" || last.text.indexOf("?") === -1) return [];
    var opts = [];
    last.text.split("\n").forEach(function (line) {
      var m = /^\s*[-*•]\s+(.{1,60})$/.exec(line);
      if (m) opts.push(m[1].trim());
    });
    return opts.length >= 2 && opts.length <= 8 ? opts : [];
  }

  var STATUS_TEXT = { stopped: "Stopped.", limit: "Turn limit reached.", error: "Error" };

  function render() {
    if (!snap) return;
    // Theme: the main window's own CSS variables.
    var theme = snap.theme || {};
    Object.keys(theme).forEach(function (k) { document.documentElement.style.setProperty(k, theme[k]); });

    // Sessions dropdown.
    var sessions = snap.sessions || [];
    sessionSelect.innerHTML = sessions.length
      ? sessions.map(function (s) {
          return '<option value="' + esc(s.id) + '"' + (s.id === snap.activeSessionId ? " selected" : "") + ">" +
            esc(s.title) + (s.files && s.files.length ? " — " + esc(s.files.join(", ")) : "") + "</option>";
        }).join("")
      : "<option>New chat</option>";
    // Controls the main window supports (snapshot.features) — older/newer
    // builds of the two halves stay compatible.
    var features = snap.features || [];
    var hasSessions = features.indexOf("sessions") !== -1;
    el("chatToolbar").style.display = hasSessions ? "" : "none";
    // With the session dropdown the title bar just names the window;
    // without it, it names the one chat.
    el("chatTitle").textContent = !hasSessions && snap.session ? snap.session.title : "Assistant";
    sessionSelect.disabled = !sessions.length || snap.running;
    el("btnRenameSession").disabled = !snap.session;
    el("btnDeleteSession").disabled = !snap.session || snap.running;
    el("btnNewSession").disabled = snap.running;
    el("btnOnTop").classList.toggle("active", !!snap.alwaysOnTop);
    el("btnOnTop").style.display = transport.mode === "window" ? "" : "none";
    var docked = transport.mode === "docked";
    if (el("btnDock").dataset.state !== (docked ? "undock" : "dock")) {
      el("btnDock").dataset.state = docked ? "undock" : "dock";
      el("btnDock").innerHTML = docked ? ICON_UNDOCK : ICON_DOCK;
      el("btnDock").title = docked ? "Undock into its own window" : "Dock into the main window";
    }
    el("btnDock").style.display = features.indexOf("dock") !== -1 && (transport.mode === "window" || transport.mode === "docked") ? "" : "none";

    var s = snap.session;
    hint.textContent = s && s.missingFiles && s.missingFiles.length
      ? "Refers to " + s.missingFiles.join(", ") + " — not loaded." : "";

    var html = "";
    var rounds = s ? s.rounds : [];
    rounds.forEach(function (r, idx) {
      html += '<div class="round" data-round="' + esc(r.id) + '"><div class="msg-user">' + esc(r.user) + "</div>";
      r.items.forEach(function (it) {
        if (it.kind === "tool") html += '<div class="msg-tool' + (it.error ? " err" : "") + '" title="' + esc(it.args || "") + '">▸ ' + renderRefs(it.summary, r.id) + "</div>";
        else html += '<div class="msg-text">' + renderText(it.text, r.id) + "</div>";
      });
      if (r.status === "running") {
        var st = stream && stream.roundId === r.id ? stream.text : "";
        html += st ? '<div class="msg-stream">' + esc(st) + "</div>" : '<div class="msg-stream busy-dots">Working</div>';
      } else if (STATUS_TEXT[r.status]) {
        html += '<div class="msg-status' + (r.status === "error" ? " error" : "") + '">' + STATUS_TEXT[r.status] + (r.error ? " " + esc(r.error) : "") + "</div>";
      }
      var opts = idx === rounds.length - 1 && !snap.running && (snap.features || []).indexOf("answers") !== -1 ? answerOptions(r) : [];
      html += '<div class="round-actions">';
      opts.forEach(function (o) { html += '<button type="button" class="answer-opt" data-answer="' + esc(o) + '">' + esc(o) + "</button>"; });
      if (r.status !== "running") {
        html += '<button type="button" class="undo-round" data-undo="' + esc(r.id) + '"' + (r.undo === "available" ? "" : " disabled") +
          ' title="Removes the filters this round created (one undo step)">Undo this round</button>';
      }
      html += "</div></div>";
    });
    var atBottom = log.scrollHeight - log.scrollTop - log.clientHeight < 40;
    log.innerHTML = rounds.length ? html : '<div id="chatEmpty">' + (snap.available === false
      ? "The assistant needs the PhiLogg desktop app."
      : "Ask about the loaded log — e.g.\n\"I'm interested in the temperature after every positioning.\"") + "</div>";
    if (atBottom || snap.running) log.scrollTop = log.scrollHeight;

    sendBtn.textContent = snap.running ? "Stop" : "Send";
    sendBtn.classList.toggle("stop", !!snap.running);
  }

  // ------------------------------------------------------------ incoming
  var wanted = 0;
  transport.onMessage(function (msg) {
    if (!msg || typeof msg !== "object") return;
    if (msg.type === "snapshot") {
      snap = msg;
      stream = msg.stream ? { roundId: msg.stream.roundId, text: msg.stream.text } : null;
      render();
    } else if (msg.type === "changed") {
      // Pull, never trust a delta: fetch the whole session.
      wanted++;
      transport.send({ type: "getSnapshot" });
    } else if (msg.type === "stream") {
      if (!snap || !snap.session || snap.session.id !== msg.sessionId) return;
      stream = { roundId: msg.roundId, text: msg.text };
      var round = log.querySelector('.round[data-round="' + msg.roundId + '"] .msg-stream');
      if (round) { round.classList.remove("busy-dots"); round.textContent = msg.text; log.scrollTop = log.scrollHeight; }
      else render();
    } else if (msg.type === "undoResult") {
      if (msg.needsConfirm) {
        var ok = window.confirm("You created " + msg.foreign + " filter(s) below this round's filters. They would be removed too. Undo the round anyway?");
        if (ok) transport.send({ type: "undoRound", roundId: msg.roundId, force: true });
      }
    }
  });

  // ------------------------------------------------------------ outgoing
  function send() {
    if (snap && snap.running) { transport.send({ type: "stop" }); return; }
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    transport.send({ type: "send", text: text });
  }
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && !ev.shiftKey && !ev.isComposing) { ev.preventDefault(); send(); }
  });
  log.addEventListener("click", function (ev) {
    var ref = ev.target.closest("a.ref");
    if (ref) { transport.send({ type: "reveal", roundId: ref.dataset.round, token: ref.dataset.token }); return; }
    var undoBtn = ev.target.closest("button.undo-round");
    if (undoBtn && !undoBtn.disabled) { transport.send({ type: "undoRound", roundId: undoBtn.dataset.undo }); return; }
    var opt = ev.target.closest("button.answer-opt");
    if (opt && !(snap && snap.running)) transport.send({ type: "send", text: opt.dataset.answer });
  });
  sessionSelect.addEventListener("change", function () {
    transport.send({ type: "switchSession", sessionId: sessionSelect.value });
  });
  el("btnNewSession").addEventListener("click", function () { transport.send({ type: "newSession" }); input.focus(); });
  el("btnRenameSession").addEventListener("click", function () {
    if (!snap || !snap.session) return;
    var title = window.prompt("Rename this chat", snap.session.title);
    if (title != null && title.trim()) transport.send({ type: "renameSession", sessionId: snap.session.id, title: title.trim() });
  });
  el("btnDeleteSession").addEventListener("click", function () {
    if (!snap || !snap.session) return;
    if (window.confirm("Delete the chat \"" + snap.session.title + "\"? The filters it created stay.")) {
      transport.send({ type: "deleteSession", sessionId: snap.session.id });
    }
  });
  el("btnOnTop").addEventListener("click", function () {
    transport.send({ type: "setAlwaysOnTop", on: !(snap && snap.alwaysOnTop) });
  });
  el("btnDock").addEventListener("click", function () {
    transport.send({ type: transport.mode === "docked" ? "undock" : "dock" });
  });
  el("btnChatSettings").addEventListener("click", function () { transport.send({ type: "openSettings" }); });

  // Test seam (the regression suite reads what the view holds).
  window.philoggChatView = { get snapshot() { return snap; }, get stream() { return stream; }, render: render };

  transport.send({ type: "getSnapshot" });
})();
</script>
</body>
</html>

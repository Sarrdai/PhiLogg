appId: com.kleinphilipp.philogg
productName: PhiLogg
# Installer filenames use the commit short-SHA instead of package.json's
# own "version" (kept as a fixed placeholder — electron-builder expects
# real semver there, which a git SHA isn't) so the filename matches the
# in-app version stamp (PHILOGG_VERSION, see desktop-release.yml's "Stamp
# version" step) — same short-SHA scheme release.yml already uses for the
# plain philogg.html tester build. desktop-release.yml always sets
# PHILOGG_SHA before building; a manual local `npm run build` (see
# desktop/README.md) needs it set by hand or the filename is left with a
# blank in it.
artifactName: "${productName}-${env.PHILOGG_SHA}.${ext}"
directories:
  buildResources: build
files:
  - main.js
  - preload.js
  - package.json
extraResources:
  - from: ../philogg.html
    to: philogg.html
fileAssociations:
  - ext: log
    name: Log File
    description: PhiLogg log file
    role: Viewer
mac:
  target: dmg
  category: public.app-category.developer-tools
win:
  target: nsis
linux:
  target: AppImage
  category: Development
# No icon: set yet — see desktop/README.md "Adding an app icon". Do NOT
# create an empty build/icons/ directory as a placeholder: electron-builder's
# Linux target treats that directory's mere existence as "icons are meant to
# live here" and hard-fails (ERR_ELECTRON_BUILDER_CANNOT_EXECUTE) if it's
# empty, instead of falling back to its default icon the way win/mac do.
# Add build/icon.png (and icon.ico/icon.icns) plus an `icon:` line per
# platform above only once real artwork exists.
